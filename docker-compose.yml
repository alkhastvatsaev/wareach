services:
  postgres:
    image: postgres:16-alpine
    container_name: wareach-postgres
    environment:
      POSTGRES_USER: wareach
      POSTGRES_PASSWORD: wareach
      POSTGRES_DB: wareach
    ports:
      - "5432:5432"
    volumes:
      - wareach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wareach -d wareach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wareach-redis
    ports:
      - "6379:6379"
    volumes:
      - wareach_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional full stack on VPS later:
  # api / worker / beat / frontend — run natively on Mac for Agent Reach access

volumes:
  wareach_pg:
  wareach_redis:
